name: Release plugin

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Read tag description
        id: notes
        run: |
          notes_file="$RUNNER_TEMP/release-notes.md"
          if [[ "$(git cat-file -t "refs/tags/$RELEASE_TAG")" == tag ]]; then
            git for-each-ref \
              --format='%(contents:subject)%0a%0a%(contents:body)' \
              "refs/tags/$RELEASE_TAG" > "$notes_file"
            echo "generate_notes=false" >> "$GITHUB_OUTPUT"
          else
            # Lightweight tags have no message; use generated release notes.
            : > "$notes_file"
            echo "generate_notes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Package installable plugin
        working-directory: plugin
        run: zip -r "$RUNNER_TEMP/krita-stroke-sampler.zip" .

      - name: Publish release asset
        uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: ${{ runner.temp }}/krita-stroke-sampler.zip
          fail_on_unmatched_files: true
          overwrite_files: true
          body_path: ${{ runner.temp }}/release-notes.md
          generate_release_notes: ${{ steps.notes.outputs.generate_notes }}
          prerelease: ${{ contains(github.ref_name, '-') }}
